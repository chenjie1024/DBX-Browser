[package]
name = "dbx-webview-engine"
version = "0.7.8"
edition = "2021"
license = "Apache-2.0"
description = "Fetch / sanitize / reader-extraction engine for the DBX web reader plugin"

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "cookies",
] }
scraper = "0.20"
lol_html = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
